# Netlify configuration.
#
# There is nothing to build — the site is plain HTML, CSS and ES modules, so
# the repository root is what gets published, as-is.

[build]
  publish = "."
  command = ""

# Hash routing means every route already resolves to index.html, so no SPA
# rewrite is needed. This redirect only catches someone hand-typing a path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never publish the pipeline internals or local tooling.
[build.processing]
  skip_processing = true
