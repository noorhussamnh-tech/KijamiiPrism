<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kijamii Prism — Demonstration Environment</title>
    <meta
      name="description"
      content="Demonstration environment for Kijamii Prism. Anonymized data: every client, employee and figure is fictional."
    />
    <meta name="color-scheme" content="dark" />

    <!-- Not a private page, but not one that belongs in a search index either:
         it is a fixed sample, and a stale demo ranking above the real thing
         helps nobody. Reinforced by X-Robots-Tag in vercel.json. -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components.css" />

    <!-- A prism splitting light: drawn inline so it costs no request. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230e0e11'/><path d='M16 6 L27 25 H5 Z' fill='none' stroke='%23e3ff4f' stroke-width='2.2' stroke-linejoin='round'/></svg>"
    />
  </head>
  <body>
    <!-- Everything below is rendered by js/main.js, starting with the
         demonstration banner. The only markup here is the mount point and a
         no-JS message. -->
    <div id="app"></div>

    <noscript>
      <p style="padding: 2rem; font-family: system-ui; color: #f4f4f5">
        Kijamii Prism needs JavaScript enabled. This is the demonstration
        environment — all data shown is anonymized and fictional.
      </p>
    </noscript>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
